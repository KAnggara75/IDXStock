repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude_types: [markdown]
        exclude: LICENSE
        stages: [pre-commit]

      - id: end-of-file-fixer
        exclude: (LICENSE|docs/swagger\.json)
        stages: [pre-commit]


      - id: check-yaml
        stages: [pre-commit]

      - id: check-added-large-files
        args: ['--maxkb=10000']
        stages: [pre-commit]

      - id: check-merge-conflict
        stages: [pre-commit]

  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.2
    hooks:
      - id: go-imports-repo
        args:
          - "-local"
          - "github.com/KAnggara75/IDXStock"
          - "-w"
        stages: [pre-commit]

      - id: go-vet-repo-mod
        stages: [pre-commit]

      - id: go-mod-tidy
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: gogenerate
        name: go generate (code generator & openapi)
        entry: go generate ./...
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: gotest
        name: go test (unit tests)
        entry: go test ./...
        language: system
        pass_filenames: false
        stages: [pre-push]


      - id: gobuild
        name: go build (compile check)
        entry: go build -o /dev/null ./cmd/api/main.go
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: govulncheck
        name: govulncheck (Go vulnerability scan)
        entry: govulncheck ./...
        language: system
        pass_filenames: false
        stages: [pre-push]
