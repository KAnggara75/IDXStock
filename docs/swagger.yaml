basePath: /api/v1
definitions:
  models.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  models.ListingBoard:
    properties:
      code:
        type: string
      name:
        type: string
      name_en:
        type: string
    type: object
  models.StockDetailResponse:
    properties:
      board:
        type: string
      code:
        type: string
      delisting_date:
        type: string
      industry:
        type: string
      listing_date:
        type: string
      name:
        type: string
      sector:
        type: string
      shares:
        type: integer
      sub_industry:
        type: string
      sub_sector:
        type: string
    type: object
  models.StockSplitRequest:
    properties:
      end_date:
        type: string
      ratio:
        type: string
      start_date:
        type: string
      stock_code:
        type: string
    type: object
  models.SuccessResponse:
    properties:
      message:
        type: string
      status:
        type: string
    type: object
  models.SyncHistoryRequest:
    properties:
      day:
        type: integer
      month:
        type: integer
      year:
        type: integer
    type: object
info:
  contact:
    name: IDXStock Support
    url: https://github.com/KAnggara75/IDXStock
  description: Automated stock market data integration and analytics API for the Indonesia
    Stock Exchange (IDX).
  license:
    name: MIT
  title: IDXStock API
  version: "1.0"
paths:
  /assets/logos/companies/{code}:
    get:
      description: Proxies and caches company logo image from Stockbit asset CDN
      parameters:
      - description: Stock code (e.g. BBCA)
        in: path
        name: code
        required: true
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get company logo
      tags:
      - assets
  /stocks:
    get:
      description: Retrieves list of all stocks/emiten with optional filter by board
        and search query
      parameters:
      - description: Board filter (e.g. UTAMA, PENGEMBANGAN, AKSELERASI)
        in: query
        name: board
        type: string
      - description: Search by stock code or company name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.StockDetailResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get all stocks / emiten
      tags:
      - stocks
  /stocks/{code}:
    get:
      description: Retrieves detailed information for a specific stock/emiten by ticker
        code
      parameters:
      - description: Stock Ticker Code (e.g. BBCA)
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.StockDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get stock / emiten by code
      tags:
      - stocks
  /stocks/{code}/history:
    get:
      description: Queries historical trading data for a specific stock code with
        field filtering and CSV/JSON output support
      parameters:
      - description: Stock Code (e.g. BBCA)
        in: path
        name: code
        required: true
        type: string
      - description: Start date (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: End date (YYYY-MM-DD, defaults to today)
        in: query
        name: end_date
        type: string
      - description: Comma-separated field list
        in: query
        name: fields
        type: string
      - description: 'Output format (''json'' or ''csv'', default: json)'
        in: query
        name: output
        type: string
      produces:
      - application/json
      - text/csv
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get stock history records
      tags:
      - history
  /stocks/boards:
    get:
      description: Retrieves list of all distinct trading boards available in IDX
        (e.g. Main, Development, Acceleration, Watchlist, Ekonomi Baru)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get distinct trading boards
      tags:
      - stocks
  /stocks/boards/{board}:
    get:
      description: Retrieves list of stocks/emiten filtered by specific trading board
      parameters:
      - description: Trading Board (e.g. Main, Development, Acceleration, Watchlist,
          Ekonomi Baru, or Indonesian name UTAMA, PENGEMBANGAN, etc.)
        in: path
        name: board
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.StockDetailResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get stocks / emiten by board
      tags:
      - stocks
  /stocks/history/sync:
    put:
      consumes:
      - application/json
      description: Syncs daily stock history from either IDX or Pasardana. For Pasardana,
        sync runs asynchronously.
      parameters:
      - description: Source provider ('idx' or 'pasardana')
        in: query
        name: source
        required: true
        type: string
      - description: IDX Session Cookie (required for idx source)
        in: header
        name: Cookie
        type: string
      - description: Target date to sync
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.SyncHistoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Sync stock history from data source
      tags:
      - history
  /stocks/listing-boards:
    get:
      description: Retrieves list of master listing boards (code, name, name_id, description)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ListingBoard'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get master listing boards
      tags:
      - stocks
  /stocks/sectors-industries/sync:
    put:
      description: Fetches fkNewSectorId, fkNewSubSectorId, fkNewIndustryId, and fkNewSubIndustryId
        from Pasardana for stocks that currently have null sector or industry values
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponse'
      summary: Sync stock sector and industry asynchronously
      tags:
      - stocks
  /stocks/split:
    put:
      consumes:
      - application/json
      description: Adjusts historical price, volume, and shares records for a given
        stock code over a date range
      parameters:
      - description: Stock split parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.StockSplitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Apply stock split adjustments
      tags:
      - history
  /stocks/sync:
    put:
      description: Triggers background sync for stock details from Pasardana
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponse'
      summary: Sync stock details asynchronously
      tags:
      - stocks
swagger: "2.0"
