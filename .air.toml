root = "."
testdata_dir = "testData"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/idxstock"
  cmd = "go build -o ./tmp/idxstock ./cmd/api/main.go"
  delay = 1000
  exclude_dir = [
    "tmp",
    "vendor",
    "testData",
    "build",
    ".git",
    ".github",
    ".context"
  ]
  exclude_file = []
  exclude_regex = ["_test\\.go$"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = ["cmd", "internal", "migrations"]
  include_ext = ["go", "sql"]
  include_file = []
  kill_delay = "2s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = true

[misc]
  clean_on_exit = true

[proxy]
  app_port = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
