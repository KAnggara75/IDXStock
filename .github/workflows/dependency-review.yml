name: "Dependency review"
on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1
      - name: "Dependency Review"
        uses: actions/dependency-review-action@v5.0.0
        with:
          comment-summary-in-pr: always
