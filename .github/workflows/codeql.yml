name: "CodeQL Analysis (Go)"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    # 22:30 WIB (UTC+7) setiap Sabtu = 15:30 UTC setiap Sabtu (day 6)
    - cron: '30 15 * * 6'

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  analyze-go:
    name: Analyze Go code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL for Go
        uses: github/codeql-action/init@v4.38.3
        with:
          languages: go
          build-mode: autobuild

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.3
        with:
          category: "/language:go"
